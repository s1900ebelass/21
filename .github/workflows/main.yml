name: Linux Desktop RDP (Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Restore/Persist data dari container agar tidak hilang saat restart
      - name: Cache Webtop Data
        uses: actions/cache@v4
        with:
          path: config_data
          key: webtop-config-${{ github.run_id }}
          restore-keys: |
            webtop-config-

      # 2. Buat folder konfigurasi jika belum ada
      - name: Prepare Persistence Directory
        run: |
          mkdir -p config_data

      # 3. Jalankan Docker Compose (Webtop GUI)
      - name: Deploy Docker Container
        run: |
          cat << 'EOF' > docker-compose.yml
          services:
            debian-desktop:
              image: lscr.io/linuxserver/webtop:debian-xfce
              container_name: debian_gui
              ports:
                - '3000:3000'
              volumes:
                - ./config_data:/config
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=Asia/Jakarta
              shm_size: 1gb
              stdin_open: true
              tty: true
              restart: unless-stopped
          EOF
          docker compose up -d

      # 4. Jalankan Cloudflare Tunnel via Docker Container
      - name: Run Cloudflare Tunnel
        run: |
          docker run -d --network="host" cloudflare/cloudflared:latest tunnel --no-autoupdate run --token eyJhIjoiNGIyYTM1MjNiNGQyNGM0OWI3NjVmNjNlZTQzZDMzODkiLCJ0IjoiYzY1ZDA1NjMtNTExYi00ZTUwLThlOTEtNmU3YWJiYWFjY2YwIiwicyI6Ik1qTTROekF5TWpZdE9XUm1OeTAwT1dabUxXRTNZamd0WTJVNVpUVmlObUV3WldNeCJ9

      # 5. Tampilkan Informasi Akses
      - name: Show Access Status
        run: |
          echo "=================================================="
          echo "Desktop siap diakses!"
          echo "Silakan buka subdomain/domain Cloudflare yang telah Anda hubungkan."
          echo "=================================================="

      # 6. Menjaga Workflow tetap berjalan (max 6 jam per run)
      - name: Keep Alive
        run: |
          echo "Sistem berjalan... Menjaga runner tetap aktif."
          sleep 21600
