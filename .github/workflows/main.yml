name: Linux Desktop RDP (DuckDNS + Localtonet)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Restore/Persist data dari container agar tidak hilang saat restart
      - name: Cache Webtop Data
        uses: actions/cache@v4
        with:
          path: config_data
          key: webtop-config-${{ github.run_id }}
          restore-keys: |
            webtop-config-

      # 2. Buat folder konfigurasi jika belum ada
      - name: Prepare Persistence Directory
        run: |
          mkdir -p config_data

      # 3. Jalankan Docker Compose (Webtop GUI)
      - name: Deploy Docker Container
        run: |
          cat << 'EOF' > docker-compose.yml
          services:
            debian-desktop:
              image: lscr.io/linuxserver/webtop:debian-xfce
              container_name: debian_gui
              ports:
                - '3000:3000'
              volumes:
                - ./config_data:/config
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=Asia/Jakarta
              shm_size: 1gb
              stdin_open: true
              tty: true
              restart: unless-stopped
          EOF
          docker compose up -d

      # 4. Update IP DuckDNS ke Runner GitHub
      - name: Update DuckDNS IP
        run: |
          curl -s "https://www.duckdns.org/update?domains=desktop-k3&token=15fecc17-df96-4cb5-a0cf-e67ce0d6c529&ip="
          echo ""
          echo "IP DuckDNS berhasil diperbarui!"

      # 5. Connect Tunnel ke Localtonet
      - name: Run Tunnel Process
        env:
          LOCALTONET_TOKEN: ${{ secrets.LOCALTONET_TOKEN }}
        run: |
          curl -s https://localtonet.com/download/localtonet-linux-x64.zip -o localtonet.zip
          unzip -o localtonet.zip
          chmod +x localtonet
          if [ -n "$LOCALTONET_TOKEN" ]; then
            ./localtonet authtoken "$LOCALTONET_TOKEN" &
          fi

      # 6. Tampilkan Informasi Akses
      - name: Show Access Status
        run: |
          echo "=================================================="
          echo "Desktop siap diakses!"
          echo "Link Tetap Anda: http://desktop-k3.duckdns.org:3000"
          echo "=================================================="

      # 7. Menjaga Workflow tetap berjalan (max 6 jam per run)
      - name: Keep Alive
        run: |
          echo "Sistem berjalan... Menjaga runner tetap aktif."
          sleep 21600
